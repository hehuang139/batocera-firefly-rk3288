DEFAULT batocera
TIMEOUT 30

LABEL batocera
  MENU LABEL Batocera 39 - Firefly RK3288 - microSD
  LINUX /boot/linux
  INITRD /boot/initrd.lz4
  FDT /boot/rk3288-firefly.dtb
  APPEND label=BATOCERA rootwait console=tty3 console=ttyS2,115200n8 earlycon=uart8250,mmio32,0xff690000 loglevel=4
